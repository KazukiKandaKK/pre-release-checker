services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/dev.db
      STORAGE_LOCAL_PATH: /app/data/storage
      REDIS_URL: redis://redis:6379
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy --schema packages/database/prisma/schema.prisma"

  api:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/dev.db
      STORAGE_LOCAL_PATH: /app/data/storage
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: >
      sh -c "npm --prefix apps/api run start"

  runner:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/dev.db
      STORAGE_LOCAL_PATH: /app/data/storage
      REDIS_URL: redis://redis:6379
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: >
      sh -c "npm --prefix apps/runner run start"

  web:
    build:
      context: .
      target: web
    ports:
      - "80:80"
    depends_on:
      - api
